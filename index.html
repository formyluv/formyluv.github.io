
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For u, Phuoc An</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --light-x: 50%;
    --light-y: 50%;
    --light-r: 230px;
    --glow-r: 380px;
  }

  html, body { height: 100%; }

  body {
    background: #04060c;
    overflow: hidden;
    cursor: none;
  }

  /* ---------- the photo ---------- */
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4vmin;
    background:
      radial-gradient(circle at 15% 15%, #1b2a4a 0%, transparent 55%),
      radial-gradient(circle at 85% 75%, #3d1f45 0%, transparent 55%),
      linear-gradient(160deg, #0b1224 0%, #101a30 50%, #0a0f1c 100%);
  }

  .photo {
    position: relative;
    max-width: 100%;
    max-height: 100%;
    border-radius: 14px;
    overflow: hidden;
    background: #0d1322;
    transition: border-color 0.35s ease, box-shadow 0.35s ease;
  }

  .photo img {
    display: block;
    max-width: 100%;
    max-height: 88vh;
    object-fit: contain;
    filter: brightness(0.85) saturate(0.9);
    transition: filter 0.35s ease, transform 0.5s cubic-bezier(.2,.8,.2,1);
  }

  /* beam is over the photo */
  .photo.lit {
    box-shadow: 0 0 0 1px rgba(255, 226, 150, 0.35),
                0 24px 60px -18px rgba(255, 214, 120, 0.45);
  }
  .photo.lit img { filter: brightness(1.05) saturate(1.12); }

  /* the flash pulse */
  .photo.flash { animation: photoFlash 0.55s ease-out; }
  @keyframes photoFlash {
    0%   { filter: brightness(1); }
    12%  { filter: brightness(2.3) saturate(1.35) contrast(1.06); }
    45%  { filter: brightness(1.15) saturate(1.12); }
    100% { filter: brightness(1); }
  }
  .photo.flash img { animation: imgFlash 0.55s ease-out; }
  @keyframes imgFlash {
    0%   { transform: scale(1); }
    14%  { transform: scale(1.05); }
    60%  { transform: scale(1.005); }
    100% { transform: scale(1); }
  }

  /* shown only if the image path is wrong */
  .photo.broken::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg, #0d1322, #0d1322 10px, #111829 10px, #111829 20px
    );
  }

  /* ---------- darkness with a hole in it ---------- */
  .darkness {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: #020307;
    -webkit-mask-image: radial-gradient(
      circle var(--light-r) at var(--light-x) var(--light-y),
      transparent 0%, transparent 45%,
      rgba(0,0,0,0.65) 75%, #000 100%
    );
    mask-image: radial-gradient(
      circle var(--light-r) at var(--light-x) var(--light-y),
      transparent 0%, transparent 45%,
      rgba(0,0,0,0.65) 75%, #000 100%
    );
  }

  .glow {
    position: fixed;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    mix-blend-mode: screen;
    background: radial-gradient(
      circle var(--glow-r) at var(--light-x) var(--light-y),
      rgba(255, 236, 179, 0.16) 0%,
      rgba(255, 220, 140, 0.07) 35%,
      transparent 70%
    );
  }

  .bulb {
    position: fixed;
    top: 0; left: 0;
    z-index: 7;
    width: 12px; height: 12px;
    margin: -6px 0 0 -6px;
    border-radius: 50%;
    background: #fffbe8;
    box-shadow: 0 0 22px 8px rgba(255, 233, 168, 0.55);
    pointer-events: none;
    transform: translate3d(var(--light-x), var(--light-y), 0);
  }

  

  @media (max-width: 560px) {
    :root { --light-r: 150px; --glow-r: 240px; }
  }
</style>
</head>
<body>

  <div class="stage">
    <figure class="photo" id="photo">
      <img id="theImage" src="F:\Code - Phan Cong Khoa\4 my luv\lovelo.jpg" alt="" />
    </figure>
  </div>

  <div class="darkness"></div>
  <div class="glow"></div>
  <div class="bulb"></div>

<script>
/* =====================================================================
   EDIT THIS LINE ONLY — path to your photo, relative to this HTML file.
   Keep the <img src="..."> above the same (it is the initial render);
   this value is applied right after the page loads.
   ===================================================================== */
const IMAGE_SRC = "Lovelo.jpg";
/* ===================================================================== */

(function () {
  const root      = document.documentElement;
  const photo     = document.getElementById('photo');
  const theImage  = document.getElementById('theImage');

  // only (re)assign if it differs from the markup, avoids a redundant request
  if (theImage.getAttribute('src') !== IMAGE_SRC) {
    photo.classList.remove('broken');
    theImage.src = IMAGE_SRC;
  }
  theImage.addEventListener('error', function () { photo.classList.add('broken'); });
  theImage.addEventListener('load',  function () { photo.classList.remove('broken'); });

  // --- beam state ---
  let tx = window.innerWidth  / 2;
  let ty = window.innerHeight / 2;
  let x = tx, y = ty;

  const EASING      = 0.14;
  const BASE_RADIUS = 230;   // keep in sync with --light-r
  const HIT_PAD     = 40;

  let isLit  = false;
  let booted = false;        // don't flash on the very first frame

  function setPointer(px, py) { tx = px; ty = py; }

  window.addEventListener('mousemove', function (e) {
    setPointer(e.clientX, e.clientY);
  }, { passive: true });

  window.addEventListener('touchstart', function (e) {
    if (e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  window.addEventListener('touchmove', function (e) {
    if (e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  document.addEventListener('mouseleave', function () {
    tx = window.innerWidth  / 2;
    ty = window.innerHeight / 2;
  });

  

  // --- loop ---
  function loop() {
    x += (tx - x) * EASING;
    y += (ty - y) * EASING;

    root.style.setProperty('--light-x', x.toFixed(1) + 'px');
    root.style.setProperty('--light-y', y.toFixed(1) + 'px');

    const rect = photo.getBoundingClientRect();
    const nx = Math.max(rect.left, Math.min(x, rect.right));
    const ny = Math.max(rect.top,  Math.min(y, rect.bottom));
    const inside = Math.hypot(x - nx, y - ny) < BASE_RADIUS + HIT_PAD;

    if (inside !== isLit) {
      isLit = inside;
      photo.classList.toggle('lit', inside);

      if (inside && booted) {
        photo.classList.remove('flash');
        void photo.offsetWidth;
        photo.classList.add('flash');
        setTimeout(function () { photo.classList.remove('flash'); }, 560);
      }
    }

    booted = true;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
